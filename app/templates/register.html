<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - ThreeH Workshop</title>
    <meta name="description" content="Đăng ký tài khoản hệ thống quản lý ThreeH Workshop">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #C87941;
            --primary-hover: #A65E2F;
            --bg-color: #FAF9F7;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 1);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 85% 50%, rgba(30, 30, 30, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 15% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 2rem 0;
        }
        
        /* Animated background blobs */
        .blob {
            position: absolute;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.25;
            animation: float 12s infinite ease-in-out alternate;
        }
        .blob-1 { top: 0%; right: -10%; width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; background: #93c5fd; border-radius: 50%; }
        .blob-2 { bottom: 0%; left: -10%; width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; background: #cbd5e1; border-radius: 50%; animation-delay: -6s; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, -80px) scale(1.1); }
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #C87941 0%, #A65E2F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: var(--text-main);
            border-radius: 14px;
            padding: 1rem 1.25rem;
            height: 3.6rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            background: #ffffff;
            border-color: #C87941;
            box-shadow: 0 0 0 4px rgba(200, 121, 65, 0.14);
            color: var(--text-main);
        }

        .form-floating > label {
            color: var(--text-muted);
            padding: 1rem 1.25rem;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #C87941;
            transform: scale(0.85) translateY(-0.8rem) translateX(0.15rem);
            background: transparent;
            font-weight: 500;
        }

        .btn-login {
            background: linear-gradient(135deg, #C87941 0%, #A65E2F 100%);
            border: none;
            border-radius: 14px;
            padding: 0.9rem;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(200, 121, 65, 0.28);
            color: white;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(200, 121, 65, 0.42);
            background: linear-gradient(135deg, #A65E2F 0%, #8F4E24 100%);
            color: white;
        }

        .auth-link {
            color: #C87941;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: #3730a3;
            text-decoration: underline;
        }

        .alert {
            background: rgba(254, 226, 226, 0.9);
            border: 1px solid rgba(248, 113, 113, 0.5);
            color: #b91c1c;
            border-radius: 14px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="container d-flex justify-content-center px-4">
        <div class="auth-card w-100">
            <div class="brand-logo">
                <i class="bi bi-person-badge-fill me-2 text-primary"></i>ThreeH
            </div>
            <p class="text-center text-muted mb-4 fs-6">Đăng ký tài khoản thành viên mới</p>
            
            {% if error %}
            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}
            
            <form action="/register" method="POST">
                <div class="form-floating">
                    <input type="text" name="full_name" class="form-control" id="fullNameInput" placeholder="Họ và tên" required>
                    <label for="fullNameInput"><i class="bi bi-person-vcard me-2"></i>Họ và tên</label>
                </div>

                <div class="form-floating">
                    <input type="text" name="username" class="form-control" id="usernameInput" placeholder="Tên đăng nhập" required>
                    <label for="usernameInput"><i class="bi bi-person me-2"></i>Tên đăng nhập</label>
                </div>
                
                <div class="form-floating">
                    <input type="text" name="phone" class="form-control" id="phoneInput" placeholder="Số điện thoại" required>
                    <label for="phoneInput"><i class="bi bi-telephone me-2"></i>Số điện thoại</label>
                </div>

                <div class="form-floating">
                    <input type="email" name="email" class="form-control" id="emailInput" placeholder="Email (tùy chọn)">
                    <label for="emailInput"><i class="bi bi-envelope me-2"></i>Email (tùy chọn)</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Mật khẩu" required>
                    <label for="passwordInput"><i class="bi bi-shield-lock me-2"></i>Mật khẩu</label>
                </div>
                
                <button type="submit" class="btn w-100 btn-login mb-4 d-flex justify-content-center align-items-center">
                    Tạo tài khoản <i class="bi bi-check2-circle ms-2 fs-5"></i>
                </button>
            </form>
            
            <div class="text-center text-muted">
                Đã có tài khoản? <a href="/login" class="auth-link">Đăng nhập ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
