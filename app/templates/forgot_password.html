<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quên mật khẩu - ThreeH Workshop</title>
    <meta name="description" content="Hướng dẫn khôi phục mật khẩu ThreeH Workshop">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #FAF9F7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .card { max-width: 520px; width: 100%; border-radius: 20px; border: 1px solid #E4DFD8; box-shadow: 0 24px 60px rgba(15,23,42,.12); }
        ::selection { background: rgba(126,68,30,.25); }
        :focus-visible { outline: 3px solid #1E1E1E; outline-offset: 2px; border-radius: 6px; }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5 bg-white">
        <div class="mb-1 fw-bold"><i class="bi bi-gear-wide-connected me-1"></i>THREEH WORKSHOP</div>
        <h1 class="h4 fw-bold mt-2">Quên mật khẩu?</h1>
        <p class="text-muted">Hiện tại hệ thống chưa hỗ trợ đặt lại mật khẩu tự động. Vui lòng liên hệ quản lý xưởng hoặc gọi hotline để được cấp lại mật khẩu.</p>
        <div class="d-grid gap-2 mt-3">
            <a class="btn btn-dark" href="tel:0981888888"><i class="bi bi-telephone-fill me-2"></i>Gọi hotline 0981.888.888</a>
            <a class="btn btn-outline-dark" href="/login"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a>
        </div>
    </div>
</body>
</html>
